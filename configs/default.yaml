# configs/default.yaml

# camera_name = the camera OpenVLA actually sees.
# A/B (zero-shot, our scene): neither view completes the task; standing_cam was
# marginally worse than the wrist cam (both drift away then plateau), so we keep
# the original wrist cam as default. NOTE: this is a zero-shot finding for THIS
# custom scene only. A properly finetuned model (e.g. the LIBERO checkpoints) is
# trained on a third-person view and is expected to prefer it. Override per-run
# with --camera (e.g. --camera standing_cam).
camera_name: "panda_eye_in_hand"
# view_camera = reference camera shown in the live-view window (not fed to VLA).
view_camera: "standing_cam"
xml_path: "asset/panda/franka_panda_w_objs.xml"

startup_ignore_ticks: 0
phase_agnostic: false
show_vla_feed: true
overlay_hud: true
ablate_vla: false

vla_model_name: "openvla/openvla-7b"
vla_unnorm_key: "bridge_orig"

instruction: "go over the yellow cube"
prompt_template: "In:What action should the robot take to {instruction}?\nOut:"

max_tick: 100000
policy_hz: 5
sim_hz: 500

pid:
  kp: 800.0
  ki: 20.0
  kd: 100.0

workspace:
  x: [-0.3, 0.3]
  y: [-0.3, 0.3]
  z: [0.0, 0.5]

steps:
  step_scale_xyz: 0.5
  step_scale_rpy: 0.8
